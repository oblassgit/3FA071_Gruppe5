name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up MariaDB
      - name: Setup MariaDB
        uses: getong/mariadb-action@v1.11
        with:
          host port: 3800
          container port: 3307
          character set server: 'utf8'
          collation server: 'utf8_general_ci'
          mariadb version: '10.4.10'
          mysql database: 'some_test'
          mysql root password: ${{ secrets.RootPassword }}
          mysql user: 'developer'
          mysql password: ${{ secrets.DatabasePassword }}

      # Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Add secrets to properties file
        run: |
          echo "###################################" >> src/main/resources/DbData.properties 
          echo "runner.db.url=jdbc:mariadb://localhost:3306/some_test?allowMultiQueries=true" >> src/main/resources/DbData.properties
          echo "runner.db.user=developer" >> src/main/resources/DbData.properties
          echo "runner.db.pw=${{ secrets.DatabasePassword }}" >> src/main/resources/DbData.properties

      - name: Verify properties file content
        run: cat src/main/resources/DbData.properties

      # Build the project with Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Update dependency graph (optional)
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

